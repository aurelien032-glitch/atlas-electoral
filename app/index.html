<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Résultats des élections françaises, de la France entière jusqu'au bureau de vote, à partir des données officielles." />
    <title>Atlas électoral</title>
    <!-- Aperçu d'un lien partagé (réseaux, messageries) : lu sans JavaScript, donc le même pour toutes les vues. Pas
         d'og:url ni de lien canonique : ils feraient de chaque vue partagée un doublon de l'accueil. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atlas électoral" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Atlas électoral" />
    <meta property="og:description" content="Résultats des élections françaises, de la France entière jusqu'au bureau de vote, à partir des données officielles." />
    <meta property="og:image" content="https://atlas-electoral.pages.dev/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Atlas électoral : carte de la participation par département aux législatives de 2024 (1er tour)." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Premiers fichiers de données, demandés pendant que le JavaScript se télécharge. -->
    <link rel="preload" href="/data/v1/scrutins.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/geo/territoires_departements.parquet" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
