# Vérifications à chaque envoi sur main et à chaque demande de fusion : l'application (types, lint,
# tests, build) et le code du pipeline. Les contrôles sur les données tournent dans « Publier ».
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q atlas_pipeline
      # Sans publication, les contrôles de données sont sautés : on vérifie qu'ils se chargent.
      - run: python -m pytest
